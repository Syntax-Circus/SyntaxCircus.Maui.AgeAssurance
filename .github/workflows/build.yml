name: Build

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    # Android + iOS workloads both need a macOS toolchain (Xcode for iOS codegen).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitVersion needs full history, not a shallow clone
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # TODO(native step): build the Apple Declared Age Range bridge before restore/pack, as
      # SyntaxCircus.Maui.StoreKit does (needs `dotnet workload install ios --skip-manifest-update`):
      #   - name: Build native AgeAssuranceBridge.xcframework
      #     run: ./scripts/build-xcframework.sh
      # scripts/build-xcframework.sh does not exist yet; do not enable until it lands.
      - run: dotnet workload restore SyntaxCircus.Maui.AgeAssurance.slnx
      - run: dotnet restore SyntaxCircus.Maui.AgeAssurance.slnx
      - run: dotnet build SyntaxCircus.Maui.AgeAssurance.slnx --no-restore --configuration Release
      - run: dotnet test --solution SyntaxCircus.Maui.AgeAssurance.slnx --no-build --configuration Release

      - name: Pack
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: dotnet pack SyntaxCircus.Maui.AgeAssurance.slnx --no-build --configuration Release --output artifacts

      - name: Upload package artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.*nupkg
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
      id-token: write # enable GitHub OIDC token issuance for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Tag published version
        run: |
          package_path=$(find artifacts -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' | head -n 1)
          if [ -z "$package_path" ]; then
            echo "No .nupkg found to derive the release tag."
            exit 1
          fi

          package_name=$(basename "$package_path")
          version=${package_name#SyntaxCircus.Maui.AgeAssurance.}
          version=${version%.nupkg}
          tag="v$version"

          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists on origin."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
